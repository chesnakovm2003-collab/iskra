<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Iskra — Зажги свой эфир</title>
<link rel="icon" type="image/png" href="/brand/spark-favicon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #0a0a0a;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  /* ============ СТАТУС-БАР ============ */

  /* ============ ШАПКА ============ */
  .top-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 16px 10px;
    flex-shrink: 0;
    background: #0a0a0a;
  }
  .top-header .logo {
    display: flex;
    align-items: center;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.5px;
  }
  .top-header .logo img {
    display: block;
    flex-shrink: 0;
  }
  .top-header .logo .logo-text {
    background: linear-gradient(90deg, #ffb74d, #e91e63);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .top-header .actions {
    display: flex;
    gap: 16px;
    color: #fff;
  }
  .top-header .actions .ic {
    width: 22px;
    height: 22px;
    display: inline-block;
  }
  .top-header .actions svg {
    width: 100%;
    height: 100%;
    stroke: currentColor;
    fill: none;
  }

  /* ============ ТАБЫ ============ */
  .tabs {
    display: flex;
    gap: 8px;
    padding: 0 16px 10px;
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: none;
    background: #0a0a0a;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 8px 16px;
    background: #1a1a1a;
    color: #aaa;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    transition: 0.15s;
    border: 1px solid #222;
    font-family: inherit;
  }
  .tab.active {
    background: #2a2a2a;
    color: #fff;
    border-color: #333;
  }

  /* ============ СЕТКА ЭФИРОВ ============ */
  .grid {
    position: absolute;
    top: 130px;
    left: 0;
    right: 0;
    bottom: 90px;
    overflow-y: auto;
    padding: 0 12px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .grid::-webkit-scrollbar { display: none; }
  .grid::-webkit-scrollbar { display: none; }

   .card {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    height: 240px;
    width: calc(50% - 4px);
    background: #1a1a1a;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .card:active { transform: scale(0.97); }

  .card .cover {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
  }

  .card .gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 25%, transparent 50%, rgba(0,0,0,0.85) 100%);
  }

  .card .top-tag {
    position: absolute;
    top: 8px;
    left: 8px;
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 3px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    max-width: 60%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card .top-tag.hot {
    background: linear-gradient(90deg, #ff6b35, #ff3b5c);
  }

  .card .viewers {
    position: absolute;
    top: 8px;
    right: 8px;
    display: flex;
    align-items: center;
    gap: 3px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 3px 7px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
  }

  .card .bottom-info {
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: 8px;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.3;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .bottom-info .host {
    display: block;
    font-size: 11px;
    font-weight: 500;
    color: #ddd;
    margin-top: 2px;
  }

  .card .special-badge {
    position: absolute;
    bottom: 52px;
    left: 8px;
    color: #fff;
    font-size: 9px;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 8px;
    letter-spacing: 0.3px;
  }
  .card .special-badge.top1 {
    background: linear-gradient(90deg, #ffd700, #ff8f00);
    box-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
  }
  .card .special-badge.top2 {
    background: linear-gradient(90deg, #c0c0c0, #808080);
    box-shadow: 0 0 8px rgba(192, 192, 192, 0.5);
  }
  .card .special-badge.top3 {
    background: linear-gradient(90deg, #cd7f32, #8b4513);
    box-shadow: 0 0 8px rgba(205, 127, 50, 0.5);
  }

  /* ============ НИЖНЯЯ НАВИГАЦИЯ ============ */
  .bottom-nav {
    position: fixed;
    left: 8px;
    right: 8px;
    bottom: 8px;
    background: rgba(20, 20, 22, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 24px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 6px 4px;
    border: 1px solid rgba(255,255,255,0.08);
    z-index: 20;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 6px 10px;
    color: #777;
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.15s;
    flex: 1;
    position: relative;
  }
  .nav-item.active { color: #fff; }
  .nav-item svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .nav-item.active svg { stroke: #4dd8e8; }
  .nav-item.go-live {
    flex: 0 0 auto;
  }
  .nav-item.go-live .circle {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4dd8e8, #2bb8d0);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(77, 216, 232, 0.5);
  }
  .nav-item.go-live .circle svg {
    stroke: #fff;
    stroke-width: 2.5;
  }

  /* ============ МОБИЛЬНАЯ ВЕРСИЯ ============ */
  @media (max-width: 700px) {
    .top-header .logo { font-size: 20px; }
    .tab { padding: 7px 14px; font-size: 13px; }
    .card .bottom-info { font-size: 11px; }
    .card .bottom-info .host { font-size: 10px; }
  }

  @media (min-width: 700px) {
    body { padding: 20px 0; background: #050505; }
    .grid {
      max-width: 900px;
      margin: 0 auto;
      grid-template-columns: repeat(3, 1fr);
    }
    .bottom-nav {
      max-width: 500px;
      left: 50%;
      transform: translateX(-50%);
      right: auto;
      width: 500px;
    }
  }
</style>
</head>

<script src="/socket.io/socket.io.js"></script>
<script>
var FEMALE_NAMES = ['Мария', 'Катя', 'Оля', 'Аня', 'Лена', 'Соня', 'Юля', 'Даша', 'Мила', 'Ксюша', 'Вика', 'Алина', 'Настя', 'Валя', 'Таня'];
var MALE_NAMES = ['Алекс', 'Иван', 'Дмитрий', 'Сергей', 'Макс', 'Никита', 'Артём', 'Влад', 'Женя', 'Рома', 'Паша', 'Дима', 'Егор', 'Илья', 'Кирилл'];

var FEMALE_TITLES = [
  'Танцы до утра', 'Разговоры обо всём', 'Кулинарный эфир', 'Рисуем и болтаем',
  'Поём под гитару', 'Утренний кофе', 'Уютные посиделки', 'Поговорим о жизни',
  'Караоке-вечер', 'Новые знакомства', 'Вопрос-ответ', 'Делимся рецептами',
  'Астрология и знаки', 'Психология общения', 'Йога и медитация', 'Всё о моде',
  'Бьюти-советы', 'Путешествия и страны', 'Домашние животные', 'Магия и мистика',
  'Учимся вместе', 'Книжный клуб', 'Обсуждаем сериалы', 'Ночные разговоры',
  'Просто танцуй', 'Уютный вечер', 'Ретро-хиты', 'Осень в доме Ангелов'
];

var MALE_TITLES = [
  'Играем вместе', 'Музыкальный вечер', 'Обзор новинок', 'Разбор фильмов',
  'Мемы и шутки', 'Спортивный эфир', 'Прогулки по городу', 'Аниме-час',
  'Играем в шахматы', 'Смотрим футбол', 'Обзор гаджетов', 'Новости дня',
  'Рок-вечер', 'Хип-хоп баттл', 'Голосовые истории', 'Просто музыка',
  'Танцы под хиты', 'Ночной стрим', 'Разговоры с друзьями', 'Классическая музыка',
  'Просто поболтаем', 'Фитнес с утра', 'Разбор техники', 'Игровой стрим'
];

var FEMALE_CATEGORIES = ['Dance', 'Beauty', 'Music', 'Chat', 'Art', 'Cooking', 'Fashion'];
var MALE_CATEGORIES = ['Game', 'Sport', 'Music', 'Tech', 'PK', 'Nearby', 'Auto'];

var CATEGORIES = FEMALE_CATEGORIES.concat(MALE_CATEGORIES);
var COVERS = [
  'linear-gradient(135deg, #8b4513, #d4a574, #f5deb3)',
  'linear-gradient(135deg, #333, #666, #999)',
  'linear-gradient(135deg, #ff6b9d, #c44569, #f8b500)',
  'linear-gradient(135deg, #2c2c2c, #555, #888)',
  'linear-gradient(135deg, #2d4a2d, #4a7c4a)',
  'linear-gradient(135deg, #667eea, #764ba2)',
  'linear-gradient(135deg, #f093fb, #f5576c)',
  'linear-gradient(135deg, #4facfe, #00f2fe)',
  'linear-gradient(135deg, #43e97b, #38f9d7)',
  'linear-gradient(135deg, #fa709a, #fee140)',
  'linear-gradient(135deg, #30cfd0, #330867)',
  'linear-gradient(135deg, #a8edea, #fed6e3)',
  'linear-gradient(135deg, #ff9a9e, #fecfef)',
  'linear-gradient(135deg, #ffecd2, #fcb69f)',
  'linear-gradient(135deg, #ff8177, #b12a5b)',
  'linear-gradient(135deg, #f6d365, #fda085)',
  'linear-gradient(135deg, #5ee7df, #b490ca)',
  'linear-gradient(135deg, #c79081, #dfa579)',
  'linear-gradient(135deg, #8e2de2, #4a00e0)',
  'linear-gradient(135deg, #f093fb, #f5576c)'
];

function random(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

// ---------- Выбор топ-3 на текущий час ----------

// Возвращает массив из 50 чисел в случайном порядке,
// стабильный в течение часа
function getShuffledIndexes() {
  var now = new Date();
  var hourSeed = now.getFullYear() * 1000000 +
                 (now.getMonth() + 1) * 10000 +
                 now.getDate() * 100 +
                 now.getHours();

  var arr = [];
  for (var i = 0; i < 50; i++) arr.push(i);

  // LCG — линейный конгруэнтный генератор, чистая арифметика
  var state = hourSeed;
  function rng() {
    state = (state * 1664525 + 1013904223) % 4294967296;
    return state / 4294967296;
  }

  for (var j = arr.length - 1; j > 0; j--) {
    var k = Math.floor(rng() * (j + 1));
    var temp = arr[j];
    arr[j] = arr[k];
    arr[k] = temp;
  }
  return arr;
}

// Перестановка комнат: топ-3 (0, 1, 2 в новом порядке) — на первых местах
var SHUFFLED_INDEXES = getShuffledIndexes(); // например [17, 42, 8, 33, ...]

function secondsUntilNextHour() {
  var now = new Date();
  var nextHour = new Date(now);
  nextHour.setHours(now.getHours() + 1, 0, 0, 0);
  return Math.floor((nextHour - now) / 1000);
}


function makeRoom(position) {
  var special = null;
  if (position === 0) special = 'top1';
  else if (position === 1) special = 'top2';
  else if (position === 2) special = 'top3';

  var host, title, category, diamonds, isFemale;

  if (special) {
    // ---------- ТОП-3: меняются каждый час ----------
    var hour = new Date().getHours();  // 0-23

    // Сдвигаем индекс в зависимости от часа
    // Топ-1 всегда разный в разный час
    var hostIndex = (hour * 3 + position) % 20;
    var titleIndex = (hour * 5 + position) % 28;
    var catIndex = (hour * 7 + position) % 7;

    isFemale = (position % 2 === 0);

    var names = isFemale ? FEMALE_NAMES : MALE_NAMES;
    var titles = isFemale ? FEMALE_TITLES : MALE_TITLES;
    var cats = isFemale ? FEMALE_CATEGORIES : MALE_CATEGORIES;

    host = names[hostIndex % names.length];
    title = titles[titleIndex % titles.length];
    category = cats[catIndex % cats.length];
    diamonds = 14000000 - position * 2000000; // 14M, 12M, 10M
  } else {
    // ---------- ОБЫЧНЫЕ: СЛУЧАЙНЫЕ ----------
    isFemale = (position % 2 === 0);
    host = isFemale ? random(FEMALE_NAMES) : random(MALE_NAMES);
    title = isFemale ? random(FEMALE_TITLES) : random(MALE_TITLES);
    category = isFemale ? random(FEMALE_CATEGORIES) : random(MALE_CATEGORIES);
    diamonds = Math.floor(Math.random() * 18000000) + 1;
  }

  return {
    id: 'room_' + position,
    title: title,
    host: host,
    category: category,
    viewers: Math.floor(Math.random() * 500) + 5,
    cover: random(COVERS),
    special: special,
    diamonds: diamonds,
    gender: isFemale ? 'female' : 'male'
  };
}
// Генерируем новые комнаты при каждой загрузке страницы
// Перемешиваем массивы — чтобы каждый раз был новый порядок
function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = arr[i];
    arr[i] = arr[j];
    arr[j] = temp;
  }
  return arr;
}


var rooms = [];
for (var i = 0; i < 50; i++) {
  rooms.push(makeRoom(i));
}
console.log('Комнат создано:', rooms.length);

function render() {
  var grid = document.getElementById('grid');
  if (!grid) return;
  grid.innerHTML = '';

  for (var i = 0; i < rooms.length; i++) {
    var r = rooms[i];
    var card = document.createElement('div');
    card.className = 'card';

    var html = '';
    html += '<div class="cover" style="background:' + r.cover + '"></div>';
    html += '<div class="gradient"></div>';
    html += '<div class="top-tag">📡 ' + r.category + '</div>';
    html += '<div class="viewers">◉ ' + r.viewers + '</div>';
    if (r.special === 'top1') {
      html += '<div class="special-badge top1">🥇 Топ 1</div>';
    } else if (r.special === 'top2') {
      html += '<div class="special-badge top2">🥈 Топ 2</div>';
    } else if (r.special === 'top3') {
      html += '<div class="special-badge top3">🥉 Топ 3</div>';
    }
    html += '<div class="bottom-info">' + r.title +
            '<span class="host">👤 ' + r.host + '</span></div>';

    card.innerHTML = html;

    card.onclick = (function(room) {
      return function() {
        window.location.href = '/room.html?room=' + room.id +
                              '&host=' + encodeURIComponent(room.host) +
                              '&title=' + encodeURIComponent(room.title) +
                              '&diamonds=' + room.diamonds +
                              '&viewers=' + room.viewers +
                              '&gender=' + (room.gender || 'male');
      };
    })(r);

    grid.appendChild(card);
  }
}

render();

var tabs = document.querySelectorAll('.tab');
for (var t = 0; t < tabs.length; t++) {
  tabs[t].onclick = function() {
    var all = document.querySelectorAll('.tab');
    for (var k = 0; k < all.length; k++) all[k].classList.remove('active');
    this.classList.add('active');
var top3 = rooms.slice(0, 3);
var rest = rooms.slice(3);
rest.sort(function() { return Math.random() - 0.5; });
rooms = top3.concat(rest);    render();
  };
}

// ---------- Обновление счётчиков зрителей ----------
setInterval(function() {
  for (var i = 0; i < rooms.length; i++) {
    rooms[i].viewers += Math.floor(Math.random() * 11) - 5;
    if (rooms[i].viewers < 3) rooms[i].viewers = 3;
    if (rooms[i].viewers > 999) rooms[i].viewers = 999;
  }
  var els = document.querySelectorAll('.card .viewers');
  for (var j = 0; j < els.length; j++) {
    if (rooms[j]) els[j].textContent = '◉ ' + rooms[j].viewers;
  }
}, 3000);

// ---------- Проверка смены часа ----------
var currentHour = new Date().getHours();

setInterval(function() {
  var newHour = new Date().getHours();
  if (newHour !== currentHour) {
    // Час сменился — пересоздаём комнаты с новым топ-3
    currentHour = newHour;
    rooms = [];
    for (var i = 0; i < 50; i++) {
      rooms.push(makeRoom(i));
    }
    render();
    console.log('Топ-3 обновлён — новый час: ' + newHour);
  }
}, 60000);  // проверка раз в минуту
// ---------- ДОПУСК К ЭФИРУ ----------
var MIN_LEVEL_TO_STREAM = 10;

function startMyStream() {
  var myName = sessionStorage.getItem('myName');
  if (!myName) {
    var name = prompt('Как вас зовут?');
    if (!name || !name.trim()) return;
    myName = name.trim();
    sessionStorage.setItem('myName', myName);
  }

  var tmpSocket = io();
  var answered = false;

  tmpSocket.on('connect', function() {
    tmpSocket.emit('join', {
      name: myName,
      roomId: 'lobby_for_check',
      host: myName,
      gender: 'male',
      baseViewers: 0,
      diamonds: 0
    });
  });

  tmpSocket.on('user_level', function(data) {
    if (answered) return;
    answered = true;
    tmpSocket.disconnect();

    var lvl = data.level || 1;
    if (lvl < MIN_LEVEL_TO_STREAM) {
      alert(
        '🔒 Открыть свой эфир можно с уровня ' + MIN_LEVEL_TO_STREAM + '.\n\n' +
        'У вас сейчас: уровень ' + lvl + '.\n' +
        'Осталось набрать: ' + (data.remaining || 0).toLocaleString('ru-RU') + ' 💎'
      );
      return;
    }

    var newRoomId = 'my_' + Date.now();
    window.location.href =
      '/room.html?room=' + newRoomId +
      '&host=' + encodeURIComponent(myName) +
      '&title=' + encodeURIComponent('Мой эфир') +
      '&diamonds=0' +
      '&viewers=5' +
      '&gender=male';
  });

  setTimeout(function() {
    if (answered) return;
    answered = true;
    tmpSocket.disconnect();
    var newRoomId = 'my_' + Date.now();
    window.location.href =
      '/room.html?room=' + newRoomId +
      '&host=' + encodeURIComponent(myName) +
      '&title=' + encodeURIComponent('Мой эфир') +
      '&diamonds=0' +
      '&viewers=5' +
      '&gender=male';
  }, 3000);
}

function goMyPage() {
  window.location.href = '/my.html';
}

</script>
