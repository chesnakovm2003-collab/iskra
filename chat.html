<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Чат · Iskra</title>
<link rel="icon" type="image/png" href="/brand/spark-favicon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #f5f5f5;
    color: #222;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  }
  .chat-page {
    max-width: 500px;
    margin: 0 auto;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #f5f5f5;
  }
  .chat-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: #fff;
    border-bottom: 1px solid #eee;
    flex-shrink: 0;
  }
  .chat-back {
    width: 36px; height: 36px;
    background: rgba(0,0,0,0.05);
    border-radius: 50%;
    border: none;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #333;
  }
  .chat-avatar-sm {
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 900; color: #fff;
  }
  .chat-header-name { font-size: 16px; font-weight: 800; flex: 1; }
  .chat-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg-bubble {
    max-width: 75%;
    padding: 8px 12px;
    border-radius: 16px;
    font-size: 14px;
    word-wrap: break-word;
    line-height: 1.35;
  }
  .msg-bubble.me {
    align-self: flex-end;
    background: linear-gradient(135deg, #4dd8e8, #2bb8d0);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg-bubble.them {
    align-self: flex-start;
    background: #fff;
    color: #222;
    border-bottom-left-radius: 4px;
  }
  .msg-time {
    font-size: 10px;
    opacity: 0.6;
    margin-top: 3px;
    display: block;
  }
  .chat-input-row {
    display: flex;
    gap: 8px;
    padding: 10px 12px 14px;
    background: #fff;
    border-top: 1px solid #eee;
    flex-shrink: 0;
  }
  .chat-input-row input {
    flex: 1;
    background: #f0f0f0;
    border: none;
    padding: 10px 14px;
    border-radius: 22px;
    outline: none;
    font-size: 14px;
    font-family: inherit;
  }
  .chat-input-row button {
    background: linear-gradient(135deg, #4dd8e8, #2bb8d0);
    color: #fff;
    border: none;
    padding: 0 18px;
    font-size: 16px;
    font-weight: 800;
    border-radius: 22px;
    cursor: pointer;
    font-family: inherit;
  }
  .chat-cost-badge {
    text-align: center;
    font-size: 11px;
    color: #e91e63;
    font-weight: 700;
    padding: 6px 12px;
    background: #fff0f5;
    border-top: 1px solid #f5e5ec;
    flex-shrink: 0;
  }
  .chat-cost-badge.hidden { display: none; }
</style>
</head>
<body>

<div class="chat-page">
  <div class="chat-header">
    <button class="chat-back" onclick="goBack()">←</button>
    <div class="chat-avatar-sm" id="chatAvatar">?</div>
    <div class="chat-header-name" id="chatName">...</div>
  </div>
  <div class="chat-cost-badge hidden" id="chatCostBadge"></div>
  <div class="chat-body" id="chatBody"></div>
  <div class="chat-input-row">
    <input id="pmInput" placeholder="Написать сообщение..." onkeypress="onKey(event)">
    <button onclick="sendPM()">➤</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
var params = new URLSearchParams(window.location.search);
var withUser = params.get('with') || '';
var myName = sessionStorage.getItem('myName') || 'Гость';

document.getElementById('chatName').textContent = withUser;
document.title = withUser + ' · Iskra';

var avatar = document.getElementById('chatAvatar');
avatar.style.background = getAvatarGradient(withUser);
avatar.textContent = withUser.charAt(0).toUpperCase();

var socket = io();

socket.on('connect', function() {
  var lastRoom = sessionStorage.getItem('lastRoomId') || 'default';
  socket.emit('join', {
    name: myName,
    roomId: lastRoom,
    host: sessionStorage.getItem('lastRoomHost') || myName,
    gender: 'male',
    baseViewers: 1,
    diamonds: 0
  });

  // Запрашиваем историю переписки
  socket.emit('pm_get', { with: withUser });
});

socket.on('pm_history', function(data) {
  if (data.with !== withUser) return;
  renderMessages(data.messages || []);
});

socket.on('pm_new', function(msg) {
  // Добавляем в текущий чат, если это переписка с нашим собеседником
  if ((msg.from === myName && msg.to === withUser) ||
      (msg.from === withUser && msg.to === myName)) {
    appendMessage(msg);
  }
});

socket.on('pm_error', function(data) {
  alert(data.message || 'Ошибка');
});

socket.on('pm_chat_cost', function(data) {
  var badge = document.getElementById('chatCostBadge');
  if (!badge) return;
  var cost = data.cost || 0;
  if (withUser === myName) {
    // Это моя цена — показываем, сколько беру с других
    badge.classList.remove('hidden');
    badge.textContent = '💰 Ты берёшь ' + cost + ' 💎 за сообщение от других';
  } else {
    // Смотрим на цену собеседника — сейчас у нас нет способа её узнать.
    // Скрываем бейдж, пока не реализуем.
    badge.classList.add('hidden');
  }
});

function goBack() { history.back(); }

function getAvatarGradient(name) {
  var colors = [
    'linear-gradient(135deg, #ff6b9d, #c44569)',
    'linear-gradient(135deg, #4dd8e8, #2bb8d0)',
    'linear-gradient(135deg, #ffd54f, #f57c00)',
    'linear-gradient(135deg, #9c27b0, #673ab7)',
    'linear-gradient(135deg, #43e97b, #38f9d7)',
    'linear-gradient(135deg, #f093fb, #f5576c)'
  ];
  var sum = 0;
  for (var i = 0; i < name.length; i++) sum += name.charCodeAt(i);
  return colors[sum % colors.length];
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function formatTime(ts) {
  var d = new Date(ts);
  var hh = String(d.getHours()).padStart(2, '0');
  var mi = String(d.getMinutes()).padStart(2, '0');
  return hh + ':' + mi;
}

function renderMessages(msgs) {
  var body = document.getElementById('chatBody');
  body.innerHTML = '';
  msgs.forEach(function(m) {
    appendMessage(m);
  });
  body.scrollTop = body.scrollHeight;
}

function appendMessage(m) {
  var body = document.getElementById('chatBody');
  var div = document.createElement('div');
  var isMe = (m.from === myName);
  div.className = 'msg-bubble ' + (isMe ? 'me' : 'them');
  div.innerHTML = escapeHtml(m.text) + '<span class="msg-time">' + formatTime(m.ts) + '</span>';
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

function sendPM() {
  var input = document.getElementById('pmInput');
  var text = input.value.trim();
  if (!text) return;
  socket.emit('pm_send', { to: withUser, text: text });
  input.value = '';
}

function onKey(e) {
  if (e.key === 'Enter') sendPM();
}
</script>
</body>
</html>
