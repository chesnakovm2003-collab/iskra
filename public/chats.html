<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Чаты · Iskra</title>
<link rel="icon" type="image/png" href="/brand/spark-favicon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow-y: auto;
    background: #f5f5f5;
    color: #222;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  }
  .chats-page {
    max-width: 500px;
    margin: 0 auto;
    background: #f5f5f5;
    min-height: 100%;
    padding-bottom: 90px;
  }
  .chats-header {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    background: #f5f5f5;
    position: sticky;
    top: 0;
    z-index: 10;
    gap: 12px;
    border-bottom: 1px solid #eee;
  }
  .chats-back {
    width: 36px; height: 36px;
    background: rgba(0,0,0,0.05);
    border-radius: 50%;
    border: none;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #333;
  }
  .chats-title { font-size: 18px; font-weight: 800; flex: 1; }
  .chats-empty {
    text-align: center;
    padding: 60px 20px;
    color: #999;
    font-size: 14px;
  }
  .chat-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    cursor: pointer;
    border-bottom: 1px solid #eee;
    background: #fff;
    transition: 0.15s;
  }
  .chat-row:active { background: #f0f0f0; }
  .chat-avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 900; color: #fff;
    background: #4dd8e8;
  }
  .chat-info { flex: 1; min-width: 0; }
  .chat-name { font-size: 15px; font-weight: 800; color: #222; }
  .chat-preview {
    font-size: 13px;
    color: #888;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat-preview.unread { color: #222; font-weight: 700; }
  .chat-meta { text-align: right; flex-shrink: 0; }
  .chat-time { font-size: 11px; color: #999; }
  .chat-unread {
    display: inline-block;
    background: #ff3b5c;
    color: #fff;
    font-size: 11px;
    font-weight: 900;
    padding: 1px 6px;
    border-radius: 10px;
    margin-top: 4px;
  }
</style>
</head>
<body>

<div class="chats-page">
  <div class="chats-header">
    <button class="chats-back" onclick="goBack()">←</button>
    <div class="chats-title">Чаты</div>
  </div>
  <div id="chatsList">
    <div class="chats-empty">Загрузка...</div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
var socket = io();
var myName = sessionStorage.getItem('myName') || 'Гость';

// Хранилище последних сообщений по каждому собеседнику
var lastMessages = {}; // withName -> { text, ts, from }
var unreadCounts = {}; // withName -> число

socket.on('connect', function() {
  var lastRoom = sessionStorage.getItem('lastRoomId') || 'default';
  socket.emit('join', {
    name: myName,
    roomId: lastRoom,
    host: sessionStorage.getItem('lastRoomHost') || myName,
    gender: 'male',
    baseViewers: 1,
    diamonds: 0
  });
});

// Пришло новое сообщение — обновляем список
socket.on('pm_new', function(msg) {
  if (msg.from === myName || msg.to === myName) {
    var withUser = (msg.from === myName) ? msg.to : msg.from;
    lastMessages[withUser] = { text: msg.text, ts: msg.ts, from: msg.from };
    // Считаем непрочитанным, если это не от меня и мы не в этом чате
    if (msg.from !== myName) {
      unreadCounts[withUser] = (unreadCounts[withUser] || 0) + 1;
    }
    renderChats();
  }
});

// История — заполняем lastMessages
socket.on('pm_history', function(data) {
  var msgs = data.messages || [];
  if (msgs.length > 0) {
    var last = msgs[msgs.length - 1];
    lastMessages[data.with] = { text: last.text, ts: last.ts, from: last.from };
    renderChats();
  }
});

// Список собеседников — можно взять из данных, которые сервер прислал бы
// Но у нас сейчас нет такого списка. Сделаем простой вариант:
// берём тех, с кем уже есть переписка (localStorage) + тех, кто написал.
var knownUsers = JSON.parse(localStorage.getItem('pm_known_users') || '[]');
// Добавим себя, чтобы точно не потерять
if (knownUsers.indexOf(myName) === -1 && myName) {
  // ничего, себя не добавляем
}

socket.on('pm_new', function(msg) {
  var withUser = (msg.from === myName) ? msg.to : msg.from;
  if (knownUsers.indexOf(withUser) === -1) {
    knownUsers.push(withUser);
    localStorage.setItem('pm_known_users', JSON.stringify(knownUsers));
  }
});

function goBack() { history.back(); }

function getAvatarGradient(name) {
  var colors = [
    'linear-gradient(135deg, #ff6b9d, #c44569)',
    'linear-gradient(135deg, #4dd8e8, #2bb8d0)',
    'linear-gradient(135deg, #ffd54f, #f57c00)',
    'linear-gradient(135deg, #9c27b0, #673ab7)',
    'linear-gradient(135deg, #43e97b, #38f9d7)',
    'linear-gradient(135deg, #f093fb, #f5576c)'
  ];
  var sum = 0;
  for (var i = 0; i < name.length; i++) sum += name.charCodeAt(i);
  return colors[sum % colors.length];
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function formatTime(ts) {
  var d = new Date(ts);
  var now = new Date();
  var diff = Math.floor((now - d) / 1000);
  if (diff < 60) return 'сейчас';
  if (diff < 3600) return Math.floor(diff / 60) + ' мин';
  if (diff < 86400) {
    var hh = String(d.getHours()).padStart(2, '0');
    var mi = String(d.getMinutes()).padStart(2, '0');
    return hh + ':' + mi;
  }
  var dd = String(d.getDate()).padStart(2, '0');
  var mm = String(d.getMonth() + 1).padStart(2, '0');
  return dd + '.' + mm;
}

function renderChats() {
  var el = document.getElementById('chatsList');
  if (!el) return;

  // Собираем всех известных + тех, у кого есть lastMessages
  var allUsers = {};
  knownUsers.forEach(function(u) { allUsers[u] = true; });
  Object.keys(lastMessages).forEach(function(u) { allUsers[u] = true; });

  var users = Object.keys(allUsers);

  if (users.length === 0) {
    el.innerHTML = '<div class="chats-empty">Пока нет переписок.<br>Открой чей-нибудь профиль в эфире и нажми «Чат».</div>';
    return;
  }

  // Сортируем по времени последнего сообщения
  users.sort(function(a, b) {
    var ta = lastMessages[a] ? lastMessages[a].ts : 0;
    var tb = lastMessages[b] ? lastMessages[b].ts : 0;
    return tb - ta;
  });

  el.innerHTML = '';
  users.forEach(function(name) {
    var last = lastMessages[name];
    var unread = unreadCounts[name] || 0;
    var row = document.createElement('div');
    row.className = 'chat-row';
    row.onclick = function() {
      unreadCounts[name] = 0;
      window.location.href = '/chat.html?with=' + encodeURIComponent(name);
    };

    var previewText = last ? ((last.from === myName ? 'Вы: ' : '') + escapeHtml(last.text)) : 'Нет сообщений';
    var previewCls = unread > 0 ? 'chat-preview unread' : 'chat-preview';
    var timeText = last ? formatTime(last.ts) : '';

    row.innerHTML =
      '<div class="chat-avatar" style="background:' + getAvatarGradient(name) + '">' +
        name.charAt(0).toUpperCase() +
      '</div>' +
      '<div class="chat-info">' +
        '<div class="chat-name">' + escapeHtml(name) + '</div>' +
        '<div class="' + previewCls + '">' + previewText + '</div>' +
      '</div>' +
      '<div class="chat-meta">' +
        '<div class="chat-time">' + timeText + '</div>' +
        (unread > 0 ? '<div class="chat-unread">' + unread + '</div>' : '') +
      '</div>';
    el.appendChild(row);
  });
}

// Периодически запрашиваем историю у всех известных — чтобы обновить превью
setInterval(function() {
  knownUsers.forEach(function(u) {
    socket.emit('pm_get', { with: u });
  });
}, 5000);

renderChats();
</script>
</body>
</html>
