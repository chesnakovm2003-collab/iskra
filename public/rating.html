<!DOCTYPE html>
<html lang="ru">
<head>
<script src="/auth-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Рейтинг · Iskra</title>
<link rel="icon" type="image/png" href="/brand/spark-favicon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow-y: auto;
    background: #f5f5f5;
    color: #222;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  }
  .rating-page {
    max-width: 500px;
    margin: 0 auto;
    background: #f5f5f5;
    min-height: 100%;
    padding-bottom: 40px;
  }
  .rt-header {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    background: #f5f5f5;
    position: sticky;
    top: 0;
    z-index: 10;
    gap: 12px;
    border-bottom: 1px solid #eee;
  }
  .rt-back {
    width: 36px; height: 36px;
    background: rgba(0,0,0,0.05);
    border-radius: 50%;
    border: none;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #333;
  }
  .rt-title { font-size: 18px; font-weight: 800; flex: 1; }
  .rt-tabs {
    display: flex;
    gap: 6px;
    padding: 12px 16px;
    overflow-x: auto;
    scrollbar-width: none;
    background: #f5f5f5;
    border-bottom: 1px solid #eee;
  }
  .rt-tabs::-webkit-scrollbar { display: none; }
  .rt-tab {
    background: #fff;
    color: #666;
    font-size: 13px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    border: 1px solid #e0e0e0;
    transition: 0.15s;
    font-family: inherit;
  }
  .rt-tab.active {
    background: linear-gradient(135deg, #4dd8e8, #2bb8d0);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 12px rgba(77,216,232,0.4);
  }
  .rt-list {
    padding: 12px 16px;
  }
  .rt-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .rt-row.top1 {
    background: linear-gradient(135deg, #fff9e6, #fff3cc);
    border: 2px solid #ffd54f;
    box-shadow: 0 4px 16px rgba(255,213,79,0.4);
  }
  .rt-row.top2 {
    background: linear-gradient(135deg, #f5f5f5, #e8e8e8);
    border: 2px solid #c0c0c0;
  }
  .rt-row.top3 {
    background: linear-gradient(135deg, #fdf4ec, #f8e0c8);
    border: 2px solid #cd7f32;
  }
  .rt-rank {
    width: 30px;
    text-align: center;
    font-size: 18px;
    font-weight: 900;
    color: #999;
    flex-shrink: 0;
  }
  .rt-rank.top1 { color: #ffb300; font-size: 24px; }
  .rt-rank.top2 { color: #999; font-size: 22px; }
  .rt-rank.top3 { color: #cd7f32; font-size: 22px; }
  .rt-avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 900; color: #fff;
    flex-shrink: 0;
    border: 2px solid transparent;
  }
  .rt-row.top1 .rt-avatar { border-color: #ffd54f; }
  .rt-row.top2 .rt-avatar { border-color: #c0c0c0; }
  .rt-row.top3 .rt-avatar { border-color: #cd7f32; }
  .rt-info { flex: 1; min-width: 0; }
  .rt-name {
    font-size: 15px;
    font-weight: 800;
    color: #222;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rt-sub {
    font-size: 12px;
    color: #888;
    margin-top: 2px;
  }
  .rt-amount {
    font-size: 15px;
    font-weight: 900;
    color: #e91e63;
    flex-shrink: 0;
  }
  .rt-amount::before {
    content: '💎 ';
    font-size: 13px;
  }
  .rt-empty {
    text-align: center;
    padding: 60px 20px;
    color: #999;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="rating-page">
  <div class="rt-header">
    <button class="rt-back" onclick="history.back()">←</button>
    <div class="rt-title">📊 Рейтинг ведущих</div>
  </div>

  <div class="rt-tabs">
    <button class="rt-tab active" data-period="day" onclick="setPeriod('day')">За день</button>
    <button class="rt-tab" data-period="week" onclick="setPeriod('week')">За неделю</button>
    <button class="rt-tab" data-period="month" onclick="setPeriod('month')">За месяц</button>
    <button class="rt-tab" data-period="all" onclick="setPeriod('all')">За всё время</button>
  </div>

  <div class="rt-list" id="rtList">
    <div class="rt-empty">Загрузка...</div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
var socket = io();
var myName = sessionStorage.getItem('myName') || 'Гость';
var currentPeriod = 'day';
var ratingData = [];

socket.on('connect', function() {
  socket.emit('join', {
    name: myName,
    roomId: 'rating_page',
    host: myName,
    gender: 'male',
    baseViewers: 0,
    diamonds: 0
  });
  setTimeout(function() {
    socket.emit('rating_get', { period: currentPeriod });
  }, 300);
});

socket.on('rating_data', function(data) {
  ratingData = data || [];
  renderRating();
});

function setPeriod(period) {
  currentPeriod = period;
  var tabs = document.querySelectorAll('.rt-tab');
  for (var i = 0; i < tabs.length; i++) {
    if (tabs[i].getAttribute('data-period') === period) tabs[i].classList.add('active');
    else tabs[i].classList.remove('active');
  }
  document.getElementById('rtList').innerHTML = '<div class="rt-empty">Загрузка...</div>';
  socket.emit('rating_get', { period: period });
}

function getAvatarGradient(name) {
  var colors = [
    'linear-gradient(135deg, #ff6b9d, #c44569)',
    'linear-gradient(135deg, #4dd8e8, #2bb8d0)',
    'linear-gradient(135deg, #ffd54f, #f57c00)',
    'linear-gradient(135deg, #9c27b0, #673ab7)',
    'linear-gradient(135deg, #43e97b, #38f9d7)',
    'linear-gradient(135deg, #f093fb, #f5576c)'
  ];
  var sum = 0;
  for (var i = 0; i < name.length; i++) sum += name.charCodeAt(i);
  return colors[sum % colors.length];
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function renderRating() {
  var list = document.getElementById('rtList');
  if (!ratingData.length) {
    list.innerHTML = '<div class="rt-empty">Пока никого нет в рейтинге.<br>Зарабатывай 💎 в эфире — и попадёшь сюда!</div>';
    return;
  }
  list.innerHTML = '';
  for (var i = 0; i < ratingData.length; i++) {
    var r = ratingData[i];
    var rank = i + 1;
    var cls = 'rt-row';
    var rankCls = 'rt-rank';
    if (rank === 1) { cls += ' top1'; rankCls += ' top1'; }
    else if (rank === 2) { cls += ' top2'; rankCls += ' top2'; }
    else if (rank === 3) { cls += ' top3'; rankCls += ' top3'; }

    var medal = '';
    if (rank === 1) medal = '🥇';
    else if (rank === 2) medal = '🥈';
    else if (rank === 3) medal = '🥉';

    var row = document.createElement('div');
    row.className = cls;
    row.innerHTML =
      '<div class="' + rankCls + '">' + (medal || rank) + '</div>' +
      '<div class="rt-avatar" style="background:' + getAvatarGradient(r.name) + '">' +
        escapeHtml(r.name.charAt(0).toUpperCase()) +
      '</div>' +
      '<div class="rt-info">' +
        '<div class="rt-name">' + escapeHtml(r.name) + '</div>' +
        '<div class="rt-sub">Lv. ' + (r.level || '?') + '</div>' +
      '</div>' +
      '<div class="rt-amount">' + (r.amount || 0).toLocaleString('ru-RU') + '</div>';
    list.appendChild(row);
  }
}
</script>
</body>
</html>
